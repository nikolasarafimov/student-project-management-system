<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Project Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <header class="bg-primary text-white shadow-sm">
        <div class="container py-3 d-flex justify-content-between align-items-center">
            <a href="/projects" class="h3 mb-0" style="text-decoration: none">Student Project Management</a>
            <nav class="d-flex align-items-center gap-2">
                <a href="/projects" class="text-white text-decoration-none">Home</a>
                <a href="/projects/add-form" class="btn btn-light btn-sm" sec:authorize="hasRole('STUDENT')">Add Project</a>
                <a href="/login" class="btn btn-light btn-sm" sec:authorize="!isAuthenticated()">Log in</a>
                <span class="ms-2 text-white" sec:authorize="isAuthenticated()">
                    Hello, <strong sec:authentication="name"></strong>
                </span>
                <a href="/logout" class="text-white text-decoration-none" sec:authorize="isAuthenticated()">Logout</a>
            </nav>
        </div>
    </header>

    <main class="flex-fill">
        <div class="container my-5">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h2 class="h5 mb-0">Add / Edit Project</h2>
                </div>
                <div class="card-body">
                    <form th:action="${project.id} == null ? @{/projects/add} : @{/projects/edit/{id}(id=${project.id})}" th:object="${project}" method="POST" class="row g-3">
                        <div class="col-md-6">
                            <label for="topic" class="form-label">Topic</label>
                            <input type="text" id="topic" name="topic" th:value="${project?.topic}" th:field="*{topic}" class="form-control" required th:classappend="${#fields.hasErrors('topic')} ? ' is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('topic')}" th:errors="*{topic}"></div>
                        </div>

                        <div class="col-md-12">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description" name="description" th:text="${project?.description}" class="form-control" rows="3" th:field="*{description}" required th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="newLabels" class="form-label">Labels (comma-separated)</label>
                            <input type="text" id="newLabels" name="newLabels" placeholder="e.g. Sports, Technology" class="form-control" th:value="${labelsStr}">
                        </div>

                        <div class="col-md-6">
                            <label for="newTechnologies" class="form-label">Technologies (comma-separated)</label>
                            <input type="text" id="newTechnologies" name="newTechnologies" placeholder="e.g. Java, Spring Boot" class="form-control" th:value="${technologiesStr}">
                        </div>

                        <div class="col-md-6">
                            <label for="course" class="form-label">Course</label>
                            <input type="text" id="course" name="course" th:value="${project?.course}" th:field="*{course}" class="form-control" required th:classappend="${#fields.hasErrors('course')} ? ' is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="responsibleTeacherId" class="form-label">Responsible Teacher</label>
                            <select id="responsibleTeacherId" name="responsibleTeacherId" class="form-select" required>
                                <option value="">-- Select Teacher --</option>
                                <option th:each="teacher : ${teachers}"
                                        th:value="${teacher.id}"
                                        th:text="${teacher.username}"
                                        th:selected="${project?.responsibleTeacher != null ? project.responsibleTeacher.id == teacher.id : false}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="extendedFromId" class="form-label">Extended From</label>
                            <select id="extendedFromId" name="extendedFromId" class="form-select">
                                <option value="">None</option>
                                <option th:each="proj : ${projectsToExtendFrom}"
                                        th:value="${proj.id}"
                                        th:text="${proj.topic}"
                                        th:selected="${project?.extendedFrom?.id == proj.id}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="repoLink" class="form-label">Repository Link</label>
                            <input type="url" id="repoLink" name="repoLink" th:value="${project?.repoLink}" class="form-control"  th:field="*{repoLink}" required th:classappend="${#fields.hasErrors('repoLink')} ? ' is-invalid'">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('repoLink')}" th:errors="*{repoLink}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="status" class="form-label">Status</label>
                            <input type="hidden" name="status" value="DRAFT"/>
                            <select id="status" name="status" th:field="*{status}" class="form-select" disabled>
                                <option value="DRAFT" selected>Draft</option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>

                        <div class="col-12 d-flex justify-content-between">
                            <a href="/projects" class="btn btn-secondary">Back to Projects</a>
                            <button id="submit" type="submit" class="btn btn-primary">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white mt-auto py-3">
        <div class="container text-center">
            <small>&copy; 2025 Student Project Management System | Built with Spring Boot & Thymeleaf</small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
